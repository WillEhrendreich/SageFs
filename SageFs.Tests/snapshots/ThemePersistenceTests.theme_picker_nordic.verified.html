<select id="theme-picker" class="theme-select" aria-label="Theme" title="Colour theme for the dashboard" data-signals:theme="'Nordic'" data-bind:theme data-on:change="var t=event.target.value; @post('/dashboard/set-theme', {theme: t})"><option value="One Dark">Theme: One Dark</option><option value="Kanagawa">Theme: Kanagawa</option><option value="Tokyo Night">Theme: Tokyo Night</option><option value="Gruvbox">Theme: Gruvbox</option><option value="Catppuccin Mocha">Theme: Catppuccin Mocha</option><option value="Monokai">Theme: Monokai</option><option value="Dracula">Theme: Dracula</option><option value="Nordic" selected="selected">Theme: Nordic</option></select>
