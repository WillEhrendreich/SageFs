name: main build

on:
  pull_request:
  push:
    branches:
    - master

# The ENTIRE build/test/integration/pack/release-bundle pipeline lives in
# ci-pipeline.fsx as one typed F# Fun.Build pipeline. GitHub Actions supplies
# only the runners, the two checkouts, the SDK/Node install, and one invocation
# per OS leg — it encodes no build logic of its own. The exact same stages run
# locally: `dotnet fsi ci-pipeline.fsx -- ci linux` etc. (see that file's header).
#
# One matrix job builds the solution ONCE per OS in Release and runs every check
# --no-build off that output; the Linux leg additionally packs and uploads the
# release bundle. This replaces the old build + integration-host + extensions +
# benchmarks + release-artifacts jobs, which each started from a clean checkout,
# re-packed the forked MCP SDK, and rebuilt the whole solution — the "so much
# re-work" this consolidation removes. Performance is guarded locally now
# (PerfTests.fs), not by a CI benchmark job.

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: ubuntu-latest
          leg: linux
        - platform: windows-latest
          leg: windows

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v5

    - name: Checkout forked MCP SDK
      uses: actions/checkout@v5
      with:
        repository: WillEhrendreich/ModelContextProtocolSdk
        path: mcp-sdk

    - name: Install Dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # The whole pipeline. The `ci` arg enables the mutation-score gate; the OS
    # leg selects platform-appropriate stages (Linux: format, mutation, VSIX +
    # nupkg + release manifest; Windows: samples + real-daemon integration-host).
    # The `release` arg (Linux, master push only) packs the shippable bundle.
    - name: Run pipeline
      shell: bash
      env:
        SOURCE_SHA: ${{ github.sha }}
        SOURCE_RUN_ID: ${{ github.run_id }}
        SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
      run: >-
        dotnet fsi ci-pipeline.fsx -- ci ${{ matrix.leg }}${{ (github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.leg == 'linux') && ' release' || '' }}

    # Build once, promote — publish.yml (workflow_run on this build's success)
    # downloads exactly this `release-assets` bundle (nupkg + vsix +
    # release-manifest.json) and ships it. No separate job rebuilds it.
    - name: Upload release bundle
      if: github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.leg == 'linux'
      uses: actions/upload-artifact@v4
      with:
        name: release-assets
        path: release/*
        if-no-files-found: error
        retention-days: 1

  # vscode-journeys (HR-VSC-E2E, LT-VSC-E2E) was removed 2026-09-12: it never
  # passed since being wired in. The real bug it caught (executeCommand typing
  # command ids instead of palette titles) is fixed and covered by a fast
  # default-suite contract test (SageFsPaletteCommand contract,
  # VscodeExtensionTests.fs). The remaining failure — VS Code's own CDP debug
  # port becoming unreachable shortly after launch — reproduced identically on
  # two different Windows runner images and was not resolved within a
  # reasonable investigation budget; see issue #133. The dodJourneys test code
  # stays in VscodeExtensionTests.fs, runnable on demand via --integration-vsc
  # with VSCODE_PATH set, but no CI job invokes it until #133 is resolved.
  # quality/definition-of-done.json marks HR-VSC-E2E/LT-VSC-E2E "deferred"
  # (not "verified" — it never was) rather than silently dropping the obligation.
