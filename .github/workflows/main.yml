name: main build

on:
  pull_request:
  push:
    branches:
    - master

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v5

    - name: Checkout forked MCP SDK
      uses: actions/checkout@v5
      with:
        repository: WillEhrendreich/ModelContextProtocolSdk
        path: mcp-sdk

    - name: Install Dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x
        dotnet-quality: preview

    - name: Build forked MCP SDK packages
      run: |
        dotnet pack mcp-sdk/src/ModelContextProtocol.Core -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false
        dotnet pack mcp-sdk/src/ModelContextProtocol -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false
        dotnet pack mcp-sdk/src/ModelContextProtocol.AspNetCore -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false

    - name: Build
      run: dotnet build
      
    - name: Test
      shell: bash
      run: |
        set +e
        dotnet run --no-build --project SageFs.Tests -- --summary
        rc=$?
        # Expecto exit code 2 = no TTY (cosmetic); treat as success
        if [ $rc -eq 0 ] || [ $rc -eq 2 ]; then exit 0; else exit $rc; fi
      timeout-minutes: 10

  extensions:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Checkout forked MCP SDK
      uses: actions/checkout@v5
      with:
        repository: WillEhrendreich/ModelContextProtocolSdk
        path: mcp-sdk

    - name: Install Dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x
        dotnet-quality: preview

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build forked MCP SDK packages
      run: |
        dotnet pack mcp-sdk/src/ModelContextProtocol.Core -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false
        dotnet pack mcp-sdk/src/ModelContextProtocol -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false
        dotnet pack mcp-sdk/src/ModelContextProtocol.AspNetCore -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false

    - name: Build core
      run: dotnet build

    - name: Check formatting
      run: dotnet format --verify-no-changes --verbosity minimal

    - name: Build VS Code extension
      working-directory: sagefs-vscode
      run: |
        dotnet tool restore
        npm ci
        npm run compile

    - name: Get VS Code extension version
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      id: vscode-version
      working-directory: sagefs-vscode
      run: |
        version=$(node -p "require('./package.json').version")
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Package VS Code extension
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      working-directory: sagefs-vscode
      run: |
        npx @vscode/vsce package -o "../sagefs-vscode-${{ steps.vscode-version.outputs.version }}.vsix"

    - name: Upload VS Code extension artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@v4
      with:
        name: release-vscode-vsix
        path: sagefs-vscode-${{ steps.vscode-version.outputs.version }}.vsix
        if-no-files-found: error

  benchmarks:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
    - uses: actions/checkout@v5

    - name: Checkout forked MCP SDK
      uses: actions/checkout@v5
      with:
        repository: WillEhrendreich/ModelContextProtocolSdk
        path: mcp-sdk

    - name: Install Dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x
        dotnet-quality: preview

    - name: Build forked MCP SDK packages
      run: |
        dotnet pack mcp-sdk/src/ModelContextProtocol.Core -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false
        dotnet pack mcp-sdk/src/ModelContextProtocol -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false
        dotnet pack mcp-sdk/src/ModelContextProtocol.AspNetCore -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false

    - name: Run benchmarks
      run: dotnet run -c Release --project SageFs.Tests -- --benchmark --filter "*" --exporters json
      timeout-minutes: 15

    - name: Check regression thresholds
      run: dotnet fsi scripts/check-benchmarks.fsx BenchmarkDotNet.Artifacts/results

    - name: Upload benchmark artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: benchmark-results
        path: BenchmarkDotNet.Artifacts/results/

  vs-extension:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5

    - name: Checkout forked MCP SDK
      uses: actions/checkout@v5
      with:
        repository: WillEhrendreich/ModelContextProtocolSdk
        path: mcp-sdk

    - name: Install Dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x
          8.0.x
        dotnet-quality: preview

    - name: Build forked MCP SDK packages
      run: |
        dotnet pack mcp-sdk/src/ModelContextProtocol.Core -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false
        dotnet pack mcp-sdk/src/ModelContextProtocol -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false
        dotnet pack mcp-sdk/src/ModelContextProtocol.AspNetCore -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false

    - name: Build Visual Studio extension
      run: dotnet build sagefs-vs/SageFs.VisualStudio/SageFs.VisualStudio.csproj -c Release

    - name: Run VS extension Editor tests
      run: dotnet test sagefs-vs/SageFs.VisualStudio.Editor.Tests/SageFs.VisualStudio.Editor.Tests.csproj --nologo --logger "console;verbosity=minimal"

    - name: Run VS extension Core tests
      run: dotnet test sagefs-vs/SageFs.VisualStudio.Core.Tests/SageFs.VisualStudio.Core.Tests.fsproj --nologo --logger "console;verbosity=minimal"

    - name: Get Visual Studio extension version
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      id: vs-version
      shell: pwsh
      run: |
        $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
        "version=$version" >> $env:GITHUB_OUTPUT

    - name: Stage Visual Studio extension artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      shell: pwsh
      run: |
        $vsix = Get-ChildItem sagefs-vs/SageFs.VisualStudio/bin/Release -Recurse -Filter *.vsix -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $vsix) { throw "Visual Studio VSIX not found." }
        Copy-Item $vsix.FullName "sagefs-visualstudio-${{ steps.vs-version.outputs.version }}.vsix"

    - name: Upload Visual Studio extension artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@v4
      with:
        name: release-visualstudio-vsix
        path: sagefs-visualstudio-${{ steps.vs-version.outputs.version }}.vsix
        if-no-files-found: error

  release-artifacts:
    needs: [build, extensions, vs-extension, benchmarks]
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      actions: read
      contents: read

    steps:
    - uses: actions/checkout@v5

    - name: Checkout forked MCP SDK
      uses: actions/checkout@v5
      with:
        repository: WillEhrendreich/ModelContextProtocolSdk
        path: mcp-sdk

    - name: Install Dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x
        dotnet-quality: preview

    - name: Build forked MCP SDK packages
      run: |
        dotnet pack mcp-sdk/src/ModelContextProtocol.Core -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false
        dotnet pack mcp-sdk/src/ModelContextProtocol -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false
        dotnet pack mcp-sdk/src/ModelContextProtocol.AspNetCore -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false

    - name: Get version
      id: version
      shell: pwsh
      run: |
        $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
        "version=$version" >> $env:GITHUB_OUTPUT

    - name: Ensure release directory exists
      run: New-Item -ItemType Directory -Force release | Out-Null

    - name: Pack SageFs
      run: dotnet pack SageFs -c Release -o release

    - name: Download VS Code extension artifact
      uses: actions/download-artifact@v4
      with:
        name: release-vscode-vsix
        path: release

    - name: Download Visual Studio extension artifact
      uses: actions/download-artifact@v4
      with:
        name: release-visualstudio-vsix
        path: release

    - name: Write release manifest
      shell: pwsh
      env:
        SOURCE_SHA: ${{ github.sha }}
        SOURCE_RUN_ID: ${{ github.run_id }}
        SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        $files = Get-ChildItem release -File | Where-Object { $_.Extension -in '.nupkg', '.vsix' } | Sort-Object Name
        if ($files.Count -lt 3) { throw "Expected release files were not staged." }
        $manifest = @{
          version = '${{ steps.version.outputs.version }}'
          sourceSha = $env:SOURCE_SHA
          sourceRunId = $env:SOURCE_RUN_ID
          sourceRunAttempt = $env:SOURCE_RUN_ATTEMPT
          files = @(
            $files | ForEach-Object {
              @{
                name = $_.Name
                sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            }
          )
        }
        $manifest | ConvertTo-Json -Depth 5 | Set-Content release/release-manifest.json

    - name: Upload release bundle
      uses: actions/upload-artifact@v4
      with:
        name: release-assets
        path: release/*
        if-no-files-found: error
