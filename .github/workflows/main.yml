name: main build

on:
  pull_request:
  push:
    branches:
    - master

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v5

    - name: Checkout forked MCP SDK
      uses: actions/checkout@v5
      with:
        repository: WillEhrendreich/ModelContextProtocolSdk
        path: mcp-sdk

    - name: Install Dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x
        dotnet-quality: preview

    - name: Build forked MCP SDK packages
      run: |
        dotnet pack mcp-sdk/src/ModelContextProtocol.Core -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false
        dotnet pack mcp-sdk/src/ModelContextProtocol -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false
        dotnet pack mcp-sdk/src/ModelContextProtocol.AspNetCore -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false

    - name: Build
      run: dotnet build
      
    - name: Test
      shell: bash
      run: |
        set +e
        dotnet run --no-build --project SageFs.Tests -- --summary
        rc=$?
        # Expecto exit code 2 = no TTY (cosmetic); treat as success
        if [ $rc -eq 0 ] || [ $rc -eq 2 ]; then exit 0; else exit $rc; fi
      timeout-minutes: 10

  extensions:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Checkout forked MCP SDK
      uses: actions/checkout@v5
      with:
        repository: WillEhrendreich/ModelContextProtocolSdk
        path: mcp-sdk

    - name: Install Dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x
        dotnet-quality: preview

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build forked MCP SDK packages
      run: |
        dotnet pack mcp-sdk/src/ModelContextProtocol.Core -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false
        dotnet pack mcp-sdk/src/ModelContextProtocol -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false
        dotnet pack mcp-sdk/src/ModelContextProtocol.AspNetCore -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false

    - name: Build core
      run: dotnet build

    - name: Check formatting
      run: dotnet format --verify-no-changes --verbosity minimal

    - name: Build VS Code extension
      working-directory: sagefs-vscode
      run: |
        dotnet tool restore
        npm ci
        npm run compile

  benchmarks:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
    - uses: actions/checkout@v5

    - name: Checkout forked MCP SDK
      uses: actions/checkout@v5
      with:
        repository: WillEhrendreich/ModelContextProtocolSdk
        path: mcp-sdk

    - name: Install Dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x
        dotnet-quality: preview

    - name: Build forked MCP SDK packages
      run: |
        dotnet pack mcp-sdk/src/ModelContextProtocol.Core -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false
        dotnet pack mcp-sdk/src/ModelContextProtocol -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false
        dotnet pack mcp-sdk/src/ModelContextProtocol.AspNetCore -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false

    - name: Run benchmarks
      run: dotnet run -c Release --project SageFs.Tests -- --benchmark --filter "*" --exporters json
      timeout-minutes: 15

    - name: Check regression thresholds
      run: dotnet fsi scripts/check-benchmarks.fsx BenchmarkDotNet.Artifacts/results

    - name: Upload benchmark artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: benchmark-results
        path: BenchmarkDotNet.Artifacts/results/

  vs-extension:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5

    - name: Checkout forked MCP SDK
      uses: actions/checkout@v5
      with:
        repository: WillEhrendreich/ModelContextProtocolSdk
        path: mcp-sdk

    - name: Install Dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x
          8.0.x
        dotnet-quality: preview

    - name: Build forked MCP SDK packages
      run: |
        dotnet pack mcp-sdk/src/ModelContextProtocol.Core -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false
        dotnet pack mcp-sdk/src/ModelContextProtocol -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false
        dotnet pack mcp-sdk/src/ModelContextProtocol.AspNetCore -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false

    - name: Build Visual Studio extension
      run: dotnet build sagefs-vs/SageFs.VisualStudio/SageFs.VisualStudio.csproj -c Release

    - name: Run VS extension Editor tests
      run: dotnet test sagefs-vs/SageFs.VisualStudio.Editor.Tests/SageFs.VisualStudio.Editor.Tests.csproj --nologo --logger "console;verbosity=minimal"

    - name: Run VS extension Core tests
      run: dotnet test sagefs-vs/SageFs.VisualStudio.Core.Tests/SageFs.VisualStudio.Core.Tests.fsproj --nologo --logger "console;verbosity=minimal"

  publish:
    needs: [build, extensions, vs-extension, benchmarks]
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
      packages: write
    env:
      VS_MARKETPLACE_PUBLISHER: willehrendreich

    steps:
    - uses: actions/checkout@v5

    - name: Checkout forked MCP SDK
      uses: actions/checkout@v5
      with:
        repository: WillEhrendreich/ModelContextProtocolSdk
        path: mcp-sdk

    - name: Install Dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x
        dotnet-quality: preview

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install marketplace CLIs
      run: npm install -g @vscode/vsce tfx-cli

    - name: Build forked MCP SDK packages
      run: |
        dotnet pack mcp-sdk/src/ModelContextProtocol.Core -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false
        dotnet pack mcp-sdk/src/ModelContextProtocol -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false
        dotnet pack mcp-sdk/src/ModelContextProtocol.AspNetCore -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false

    - name: Get version
      id: version
      shell: pwsh
      run: |
        $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
        "version=$version" >> $env:GITHUB_OUTPUT

    - name: Ensure release directory exists
      run: New-Item -ItemType Directory -Force release | Out-Null

    - name: Pack SageFs
      run: dotnet pack SageFs -c Release -o release

    - name: Build VS Code extension
      working-directory: sagefs-vscode
      run: |
        dotnet tool restore
        npm ci
        npx @vscode/vsce package -o ../release/sagefs-vscode-${{ steps.version.outputs.version }}.vsix

    - name: Install .NET 8 SDK for VS extension
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: Build Visual Studio extension
      run: |
        dotnet build sagefs-vs/SageFs.VisualStudio/SageFs.VisualStudio.csproj -c Release
        $vsix = Get-ChildItem sagefs-vs/SageFs.VisualStudio/bin/Release/*.vsix -ErrorAction SilentlyContinue
        if ($vsix) { Copy-Item $vsix.FullName "release/sagefs-visualstudio-${{ steps.version.outputs.version }}.vsix" }

    - name: Publish VS Code extension to Marketplace
      working-directory: sagefs-vscode
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
      run: |
        npx @vscode/vsce publish --packagePath ../release/sagefs-vscode-${{ steps.version.outputs.version }}.vsix --skip-duplicate

    - name: Publish Visual Studio extension to Marketplace
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
      run: |
        npx tfx-cli extension publish --publisher $env:VS_MARKETPLACE_PUBLISHER --vsix "release/sagefs-visualstudio-${{ steps.version.outputs.version }}.vsix" --token $env:VSCE_PAT --no-prompt

    - name: Push to NuGet
      run: dotnet nuget push "release/SageFs.${{ steps.version.outputs.version }}.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: v${{ steps.version.outputs.version }}
        files: |
          release/*.nupkg
          release/*.vsix
        body: |
          ## SageFs v${{ steps.version.outputs.version }}

          ### Downloads
          - **NuGet**: `dotnet tool install --global SageFs`
          - **VS Code Extension** (`sagefs-vscode-*.vsix`): Install via `code --install-extension sagefs-vscode-${{ steps.version.outputs.version }}.vsix`
          - **Visual Studio Extension** (`sagefs-visualstudio-*.vsix`): Double-click to install in Visual Studio 2022+
          - **Neovim**: See [sagefs.nvim](https://github.com/WillEhrendreich/sagefs.nvim)
        make_latest: true

    - name: Sync sagefs.nvim version tag
      env:
        NVIM_PAT: ${{ secrets.SAGEFS_NVIM_PAT }}
      if: env.NVIM_PAT != ''
      continue-on-error: true
      shell: pwsh
      run: |
        $tmpDir = New-Item -ItemType Directory -Path (Join-Path $env:TEMP "sagefs-nvim-$(Get-Random)")
        Push-Location $tmpDir
        git clone --depth 1 "https://x-access-token:$($env:NVIM_PAT)@github.com/WillEhrendreich/sagefs.nvim.git" .
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        Set-Content -Path "lua/sagefs/version.lua" -Value "return '${{ steps.version.outputs.version }}'"
        git add lua/sagefs/version.lua
        $changed = git diff --cached --quiet; if ($LASTEXITCODE -ne 0) { git commit -m "chore: sync version to v${{ steps.version.outputs.version }}" }
        git push origin main
        git tag -f "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }} (synced from SageFs)"
        git push origin "v${{ steps.version.outputs.version }}" --force
        Pop-Location
