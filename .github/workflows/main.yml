name: main build

on:
  pull_request:
  push:
    branches:
    - master
  workflow_dispatch:
    inputs:
      bypass_tests:
        description: "EMERGENCY RELEASE: skip the test tiers, the ratchets lane and the trust report (SAGEFS_EMERGENCY_BYPASS=1). Build, format, samples and packing still run, so release-assets is still really built. Use only when users need a working release now."
        required: false
        default: false
        type: boolean

# The ENTIRE build/test/integration/pack/release-bundle pipeline lives in
# ci-pipeline.fsx as one typed F# Partas.Build pipeline (migrated from Fun.Build;
# the stage/pipeline DSL is Fun.Build's, the flags and --help are System.CommandLine's).
# GitHub Actions supplies
# only the runner, the two checkouts, and the SDK/Node/xvfb install — it encodes
# no build logic of its own. The exact same stages run locally:
# `dotnet fsi ci-pipeline.fsx -- ci [release]` (see that file's header).
#
# ONE Linux job builds the solution once in Release and runs every check
# --no-build off that output — format, the unit suite, the mutation-score gate,
# the real-daemon integration-host suites (incl. the VS Code command-proof), and
# on a master push the VSIX + nupkg + release manifest. This replaces the old
# build (x2) + integration-host + extensions + benchmarks + release-artifacts
# jobs, which each started from a clean checkout, re-packed the forked MCP SDK,
# and rebuilt the whole solution.
#
# The former windows leg is gone: the integration-host suites and the VS Code
# command-proof were verified green on Linux (Args.resolveHostLaunch launches the
# FSI host via the dotnet muxer on non-Windows; the proof self-provisions a Linux
# VS Code under xvfb). A Windows-compatible package still ships from here — the
# tool is AnyCPU, every per-RID native is committed under runtimes/, and the
# Windows user gets the FSI host via the dotnet muxer. If a real Windows runtime
# issue ever surfaces, add a scheduled windows smoke back.

jobs:
  # ── Pushes to master: THIS machine, via the self-hosted runner. ──────────
  #
  # Nothing is rebuilt or re-tested here when the commit already passed
  # scripts/local-gate.fsx on this machine. The pre-push hook refuses to push master
  # otherwise, so normally the job only PROMOTES that gate's release bundle, in
  # seconds. If a commit arrives ungated (SAGEFS_SKIP_GATE, a push from
  # elsewhere), the job runs the same gate first. Either way there is one gate
  # (the whole ci-pipeline.fsx on a clean checkout of exactly this commit) and
  # one definition of "passed".
  #
  # SECURITY: this repo is public. A pull_request job runs the PR's OWN copy of
  # this file, so a self-hosted job reachable from pull_request would let a
  # fork run code in this machine's home directory. This job excludes
  # pull_request, and "Self-hosted runner safety" in TrustSignalTests fails the
  # fast suite if any self-hosted job stops doing so. Fork PR workflows also
  # need maintainer approval (repo setting: all_external_contributors).
  local:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, sagefs-local]
    timeout-minutes: 120
    concurrency:
      group: sagefs-local-${{ github.sha }}
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v5

    # SseParityTests derives the SSE parity check by reading the plugin repo's own
    # Lua, and this runner has no sibling checkout: _work/SageFs/sagefs.nvim does not
    # exist. `nvimRepoDir` is a module-level `let`, so the DirectoryNotFoundException
    # lands in the type initializer and aborts the process the --ratchets lane runs
    # (exit 134), rather than failing a test assertion. Gated commits never noticed,
    # because their job here is only a file lookup; an ungated push runs the whole
    # pipeline, which is how this surfaced. Checked out beside the main one and
    # pointed at with the env var the test already documents, so nothing hardcodes a
    # path on one machine.
    - name: Checkout the Neovim plugin (SseParityTests reads its Lua)
      uses: actions/checkout@v5
      with:
        repository: WillEhrendreich/sagefs.nvim
        path: sagefs.nvim

    - name: Point the SSE parity test at it
      shell: bash
      run: echo "SAGEFS_NVIM_DIR=$GITHUB_WORKSPACE/sagefs.nvim" >> "$GITHUB_ENV"

    # Same reason as publish.yml: a step's PATH resolves dotnet to the distro's
    # dotnet-host (a runtime, no SDKs). A gated commit never notices, because
    # the gate is then only a file lookup, but an ungated one runs the whole
    # pipeline and needs a real SDK.
    - name: Use this machine's .NET SDK
      shell: bash
      run: |
        root="${DOTNET_ROOT:-$HOME/.dotnet}"
        if [ ! -x "$root/dotnet" ]; then
          echo "::error::No dotnet at $root. Set DOTNET_ROOT in the runner's .env, or install the SDK there."
          exit 1
        fi
        echo "$root" >> "$GITHUB_PATH"
        echo "DOTNET_ROOT=$root" >> "$GITHUB_ENV"
        "$root/dotnet" --list-sdks

    # Node for the VS Code extension stages. This is here because the runner's
    # PATH does NOT contain a usable npm, and the failure is unreadable without
    # it — stage 5 died with
    #
    #   System.ComponentModel.Win32Exception: An error occurred trying to start
    #   process      (in 162ms, i.e. nothing ran)
    #
    # which looks like a compile failure and is not. Measured on this machine:
    #
    #   /usr/bin/node        v22.23.2   present, and has NO npm beside it
    #   /usr/bin/npm         MISSING
    #   mise 26.7.0/bin/npm  present, and NOT on the runner's PATH
    #
    # So `npm run compile` resolved `node` to the old /usr/bin one and then had
    # no npm to execute. NUGET_NODE_BIN lets a machine point at its own mise
    # install; the fallback walks mise's install tree rather than hardcoding a
    # version.
    #
    # The walk selects the HIGHEST NUMERIC version, and that detail is load
    # bearing: mise's tree also holds `lts`, `latest` and bare-major aliases
    # (`24`, `26`, `24.14`), and `sort -V | tail -1` picks `lts` — an alias for
    # 24.14.0 — over the real 26.8.2. Measured on this machine:
    #
    #   24.14.0 -> v24.14.0     lts        -> v24.14.0   <- what sort -V chose
    #   26.8.2  -> v26.8.2      latest     -> v26.8.2
    #
    # So only directories whose name is purely numeric qualify, and they are
    # ordered by the number rather than by name.
    #
    # `$HOME` is NOT trusted. The first version resolved the tree through
    # "$HOME"/.local/share/mise and failed ON THE RUNNER with exit 127 and
    # "No npm found", while the identical script run by hand — with the runner
    # listener's own HOME and its own PATH (/usr/local/bin:/usr/bin, no /bin) —
    # resolved 26.8.2 correctly. The directory was present, world-readable and
    # two weeks old, so the filesystem was not the difference. A self-hosted
    # runner can execute a step with a different HOME than its listener, and
    # the DOTNET_ROOT step only survives that because its default happens to
    # resolve on this machine.
    #
    # So: probe the known roots explicitly, and print what was searched. A
    # discovery step that fails silently is a discovery step that gets guessed
    # at again — the same lesson as the test that could not read a refusal.
    - name: Use this machine's Node (npm) for the extension stages
      shell: bash
      run: |
        roots=""
        for r in "${NUGET_NODE_BIN:-}" "$HOME/.local/share/mise/installs/node" \
                 "/home/will/.local/share/mise/installs/node" \
                 "$HOME/.nvm/versions/node"; do
          if [ -n "$r" ] && [ -d "$r" ]; then roots="$roots $r"; fi
        done
        if [ -z "$roots" ]; then
          echo "::error::No node install root. Searched NUGET_NODE_BIN, \$HOME/.local/share/mise/installs/node, /home/will/.local/share/mise/installs/node, \$HOME/.nvm/versions/node. HOME=[$HOME]."
          exit 1
        fi
        echo "roots:$roots"

        # Every directory that actually HAS an executable npm, ranked by the
        # numeric version in its own name. A name that is not a version is kept
        # but sorted last, so `lts` can never outrank 26.8.2.
        #
        # `-maxdepth 3`, not 2. npm sits at <root>/<version>/bin/npm, which is
        # THREE levels down, and the first version of this step searched with
        # `-maxdepth 2` and therefore found nothing — a discovery step that is
        # silently wrong in the one direction that matters. Measured:
        #
        #   find … -maxdepth 2 -name npm   -> (nothing)
        #   find … -maxdepth 3 -name npm   -> …/26.7.0/bin/npm, …/26.8.2/bin/npm
        #
        # `-name npm` without `-type f`, because npm is a symlink on some
        # installs and `-type f` would skip it.
        candidate=$(for r in $roots; do
            find "$r" -maxdepth 3 -name npm -perm -u+x 2>/dev/null \
              | while read -r npmPath; do echo "$(dirname "$npmPath")"; done
          done \
          | while read -r d; do
              v=$(basename "$d")
              case "$v" in
                *[!0-9.]*|'') echo "999999 $d" ;;
                *) echo "$v $d" ;;
              esac
            done \
          | sort -k1,1n -k1,1V | tail -1 | cut -d' ' -f2-)

        if [ -z "$candidate" ] || [ ! -x "$candidate/npm" ]; then
          echo "::error::No npm under:$roots. Set NUGET_NODE_BIN in the runner's .env to the bin/ containing npm."
          exit 1
        fi
        echo "using:$candidate"
        echo "$candidate" >> "$GITHUB_PATH"
        "$candidate/node" --version
        # `npm` BY ABSOLUTE PATH, not by name. $GITHUB_PATH only takes effect in
        # LATER steps, so in this one `npm` still resolves against the runner's
        # own PATH — which has /usr/bin/node and no npm beside it. That is
        # precisely how stage 5 died the first time, and it is why this step's
        # own verification has to name the binary rather than test the command
        # the next step will use. Measured on 0.6.840:
        #
        #   using:/home/will/.local/share/mise/installs/node/26.8.2/bin
        #   v26.8.2
        #   …: line 47: npm: command not found          <- exit 127
        #
        # So the discovery is verified here, and the name becomes resolvable in
        # the next step via GITHUB_PATH. Verifying the PATH the NEXT step will
        # see is the only verification that would have caught this.
        "$candidate/npm" --version

    - name: Local gate (instant when this commit already passed on this machine)
      shell: bash
      env:
        SOURCE_RUN_ID: ${{ github.run_id }}
        SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        # '1' only for an explicit emergency dispatch; every push and PR gets '0'.
        SAGEFS_EMERGENCY_BYPASS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bypass_tests == 'true' && '1' || '0' }}
      run: dotnet fsi scripts/local-gate.fsx -- "$GITHUB_SHA"

    - name: Promote the gated release bundle
      shell: bash
      run: dotnet fsi scripts/local-gate.fsx -- --promote "$GITHUB_SHA" release

    # publish.yml (workflow_run on this build's success) downloads exactly this
    # `release-assets` bundle and ships it. It is the bundle the gate built and
    # checksummed, not a rebuild.
    - name: Upload release bundle
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@v4
      with:
        name: release-assets
        path: release/*
        if-no-files-found: error
        retention-days: 1

  # ── Pull requests: GitHub-hosted only, never this machine. ──────────────
  # The same pipeline without `release`, so an outside PR still gets a real
  # check without its code ever running on the maintainer's desktop.
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v5

    # SseParityTests derives the SSE parity check by reading the plugin repo's own
    # Lua, and this runner has no sibling checkout: _work/SageFs/sagefs.nvim does not
    # exist. `nvimRepoDir` is a module-level `let`, so the DirectoryNotFoundException
    # lands in the type initializer and aborts the process the --ratchets lane runs
    # (exit 134), rather than failing a test assertion. Gated commits never noticed,
    # because their job here is only a file lookup; an ungated push runs the whole
    # pipeline, which is how this surfaced. Checked out beside the main one and
    # pointed at with the env var the test already documents, so nothing hardcodes a
    # path on one machine.
    - name: Checkout the Neovim plugin (SseParityTests reads its Lua)
      uses: actions/checkout@v5
      with:
        repository: WillEhrendreich/sagefs.nvim
        path: sagefs.nvim

    - name: Point the SSE parity test at it
      shell: bash
      run: echo "SAGEFS_NVIM_DIR=$GITHUB_WORKSPACE/sagefs.nvim" >> "$GITHUB_ENV"

    - name: Checkout forked MCP SDK
      uses: actions/checkout@v5
      with:
        repository: WillEhrendreich/ModelContextProtocolSdk
        path: mcp-sdk

    - name: Install Dotnet
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json
        dotnet-version: '10.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # The VS Code command-proof launches a real VS Code (Electron) headless.
    - name: Install xvfb
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Run pipeline
      shell: bash
      run: dotnet fsi ci-pipeline.fsx -- ci

  # vscode-journeys (HR-VSC-E2E, LT-VSC-E2E) was removed 2026-09-12: it never
  # passed since being wired in. The real bug it caught (executeCommand typing
  # command ids instead of palette titles) is fixed and covered by a fast
  # default-suite contract test (SageFsPaletteCommand contract,
  # VscodeExtensionTests.fs), and the extension-to-daemon wiring is proven by the
  # VS Code command-proof suite that now runs on Linux under --integration-host.
  # The remaining CDP-debug-port failure is tracked in issue #133; the dodJourneys
  # code stays in VscodeExtensionTests.fs, runnable via --integration-vsc with
  # VSCODE_PATH set. quality/definition-of-done.json marks HR-VSC-E2E/LT-VSC-E2E
  # "deferred" (not "verified" — it never was) rather than dropping the obligation.
