name: main build

on:
  pull_request:
  push:
    branches:
    - master
  workflow_dispatch:

# The ENTIRE build/test/integration/pack/release-bundle pipeline lives in
# ci-pipeline.fsx as one typed F# Fun.Build pipeline. GitHub Actions supplies
# only the runner, the two checkouts, and the SDK/Node/xvfb install — it encodes
# no build logic of its own. The exact same stages run locally:
# `dotnet fsi ci-pipeline.fsx -- ci [release]` (see that file's header).
#
# ONE Linux job builds the solution once in Release and runs every check
# --no-build off that output — format, the unit suite, the mutation-score gate,
# the real-daemon integration-host suites (incl. the VS Code command-proof), and
# on a master push the VSIX + nupkg + release manifest. This replaces the old
# build (x2) + integration-host + extensions + benchmarks + release-artifacts
# jobs, which each started from a clean checkout, re-packed the forked MCP SDK,
# and rebuilt the whole solution.
#
# The former windows leg is gone: the integration-host suites and the VS Code
# command-proof were verified green on Linux (Args.resolveHostLaunch launches the
# FSI host via the dotnet muxer on non-Windows; the proof self-provisions a Linux
# VS Code under xvfb). A Windows-compatible package still ships from here — the
# tool is AnyCPU, every per-RID native is committed under runtimes/, and the
# Windows user gets the FSI host via the dotnet muxer. If a real Windows runtime
# issue ever surfaces, add a scheduled windows smoke back.

jobs:
  # ── Pushes to master: THIS machine, via the self-hosted runner. ──────────
  #
  # Nothing is rebuilt or re-tested here when the commit already passed
  # scripts/local-gate on this machine. The pre-push hook refuses to push master
  # otherwise, so normally the job only PROMOTES that gate's release bundle, in
  # seconds. If a commit arrives ungated (SAGEFS_SKIP_GATE, a push from
  # elsewhere), the job runs the same gate first. Either way there is one gate
  # (the whole ci-pipeline.fsx on a clean checkout of exactly this commit) and
  # one definition of "passed".
  #
  # SECURITY: this repo is public. A pull_request job runs the PR's OWN copy of
  # this file, so a self-hosted job reachable from pull_request would let a
  # fork run code in this machine's home directory. This job excludes
  # pull_request, and "Self-hosted runner safety" in TrustSignalTests fails the
  # fast suite if any self-hosted job stops doing so. Fork PR workflows also
  # need maintainer approval (repo setting: all_external_contributors).
  local:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, sagefs-local]
    timeout-minutes: 120
    concurrency:
      group: sagefs-local-${{ github.sha }}
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v5

    # Same reason as publish.yml: a step's PATH resolves dotnet to the distro's
    # dotnet-host (a runtime, no SDKs). A gated commit never notices, because
    # the gate is then only a file lookup, but an ungated one runs the whole
    # pipeline and needs a real SDK.
    - name: Use this machine's .NET SDK
      shell: bash
      run: |
        root="${DOTNET_ROOT:-$HOME/.dotnet}"
        if [ ! -x "$root/dotnet" ]; then
          echo "::error::No dotnet at $root. Set DOTNET_ROOT in the runner's .env, or install the SDK there."
          exit 1
        fi
        echo "$root" >> "$GITHUB_PATH"
        echo "DOTNET_ROOT=$root" >> "$GITHUB_ENV"
        "$root/dotnet" --list-sdks

    - name: Local gate (instant when this commit already passed on this machine)
      shell: bash
      env:
        SOURCE_RUN_ID: ${{ github.run_id }}
        SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
      run: scripts/local-gate "$GITHUB_SHA"

    - name: Promote the gated release bundle
      shell: bash
      run: scripts/local-gate --promote "$GITHUB_SHA" release

    # publish.yml (workflow_run on this build's success) downloads exactly this
    # `release-assets` bundle and ships it. It is the bundle the gate built and
    # checksummed, not a rebuild.
    - name: Upload release bundle
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@v4
      with:
        name: release-assets
        path: release/*
        if-no-files-found: error
        retention-days: 1

  # ── Pull requests: GitHub-hosted only, never this machine. ──────────────
  # The same pipeline without `release`, so an outside PR still gets a real
  # check without its code ever running on the maintainer's desktop.
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v5

    - name: Checkout forked MCP SDK
      uses: actions/checkout@v5
      with:
        repository: WillEhrendreich/ModelContextProtocolSdk
        path: mcp-sdk

    - name: Install Dotnet
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json
        dotnet-version: '10.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # The VS Code command-proof launches a real VS Code (Electron) headless.
    - name: Install xvfb
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Run pipeline
      shell: bash
      run: dotnet fsi ci-pipeline.fsx -- ci

  # vscode-journeys (HR-VSC-E2E, LT-VSC-E2E) was removed 2026-09-12: it never
  # passed since being wired in. The real bug it caught (executeCommand typing
  # command ids instead of palette titles) is fixed and covered by a fast
  # default-suite contract test (SageFsPaletteCommand contract,
  # VscodeExtensionTests.fs), and the extension-to-daemon wiring is proven by the
  # VS Code command-proof suite that now runs on Linux under --integration-host.
  # The remaining CDP-debug-port failure is tracked in issue #133; the dodJourneys
  # code stays in VscodeExtensionTests.fs, runnable via --integration-vsc with
  # VSCODE_PATH set. quality/definition-of-done.json marks HR-VSC-E2E/LT-VSC-E2E
  # "deferred" (not "verified" — it never was) rather than dropping the obligation.
