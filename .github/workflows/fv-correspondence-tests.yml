name: fv-correspondence-tests

on:
  push:
    paths:
      - 'formal-verification/tests/**'
      - 'SageFs.Core/**'
    branches:
      - master
  pull_request:
    paths:
      - 'formal-verification/tests/**'
      - 'SageFs.Core/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Checkout forked MCP SDK
        uses: actions/checkout@v5
        with:
          repository: WillEhrendreich/ModelContextProtocolSdk
          path: mcp-sdk

      - name: Install Dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            11.0.x
          dotnet-quality: preview

      - name: Build forked MCP SDK packages
        run: |
          dotnet pack mcp-sdk/src/ModelContextProtocol.Core -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false
          dotnet pack mcp-sdk/src/ModelContextProtocol -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false
          dotnet pack mcp-sdk/src/ModelContextProtocol.AspNetCore -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false

      - name: Build SageFs.Core for correspondence tests
        run: dotnet build SageFs.Core/SageFs.Core.fsproj -c Debug --nologo -p:NuGetAudit=false

      - name: Run RingBuffer correspondence tests
        run: dotnet fsi formal-verification/tests/ringbuffer/run.fsx
