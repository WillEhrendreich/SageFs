name: Smoke Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/smoke-test.yml'
      - 'scripts/smoke-test.ps1'
      - 'samples/from-csharp/**'
      - 'SageFs/**'
      - 'SageFs.Core/**'
  push:
    branches: [master]
    paths:
      - '.github/workflows/smoke-test.yml'
      - 'scripts/smoke-test.ps1'
      - 'samples/from-csharp/**'
      - 'SageFs/**'
      - 'SageFs.Core/**'

jobs:
  smoke:
    name: End-to-end smoke test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Checkout forked MCP SDK
        uses: actions/checkout@v5
        with:
          repository: WillEhrendreich/ModelContextProtocolSdk
          path: mcp-sdk

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build forked MCP SDK packages
        run: |
          dotnet pack mcp-sdk/src/ModelContextProtocol.Core -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false
          dotnet pack mcp-sdk/src/ModelContextProtocol -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false
          dotnet pack mcp-sdk/src/ModelContextProtocol.AspNetCore -o mcp-sdk-nupkg -c Release -p:NuGetAudit=false

      - name: Build and pack SageFs tool
        run: |
          dotnet build --nologo -c Release
          dotnet pack SageFs -o nupkg --nologo -c Release

      - name: Install SageFs global tool
        run: dotnet tool install --global SageFs --add-source nupkg --no-cache

      - name: Run smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke-diagnostics | Out-Null
          pwsh -NoProfile -File scripts/smoke-test.ps1 -Port 37851 -SessionWarmupSeconds 120 2>&1 |
            Tee-Object -FilePath smoke-diagnostics\smoke.log
          exit $LASTEXITCODE
        timeout-minutes: 10

      - name: Explain smoke failure
        if: failure() || cancelled()
        shell: pwsh
        run: |
          $contextPath = "smoke-diagnostics\context.json"
          $healthPath = "smoke-diagnostics\health.json"
          $sessionsPath = "smoke-diagnostics\sessions.json"
          $stderrPath = "smoke-diagnostics\daemon-stderr.log"
          $stdoutPath = "smoke-diagnostics\daemon-stdout.log"
          $warmupPollsPath = "smoke-diagnostics\session-warmup-polls.json"
          $discoveryPollsPath = "smoke-diagnostics\test-discovery-polls.json"

          function Write-LogGroup([string]$Title, [scriptblock]$Body) {
            Write-Host "::group::$Title"
            & $Body
            Write-Host "::endgroup::"
          }

          if (-not (Test-Path $contextPath)) {
            Write-Host "No smoke diagnostics were produced."
            exit 0
          }

          $context = Get-Content $contextPath -Raw | ConvertFrom-Json
          $failedSteps = @($context.failedSteps)
          $results = @($context.results)
          $health = if (Test-Path $healthPath) { Get-Content $healthPath -Raw | ConvertFrom-Json } else { $null }
          $sessions = if (Test-Path $sessionsPath) { Get-Content $sessionsPath -Raw | ConvertFrom-Json } else { $null }
          $warmupPolls = if (Test-Path $warmupPollsPath) { @(Get-Content $warmupPollsPath -Raw | ConvertFrom-Json) } else { @() }
          $discoveryPolls = if (Test-Path $discoveryPollsPath) { @(Get-Content $discoveryPollsPath -Raw | ConvertFrom-Json) } else { @() }

          Write-LogGroup "Smoke failure context" {
            $context | ConvertTo-Json -Depth 12
          }

          if ($null -ne $health) {
            Write-LogGroup "Health snapshot" {
              $health | ConvertTo-Json -Depth 12
            }
          }

          if ($null -ne $sessions) {
            Write-LogGroup "Sessions snapshot" {
              $sessions | ConvertTo-Json -Depth 12
            }
          }

          if (Test-Path $stderrPath) {
            Write-LogGroup "Daemon stderr tail" {
              Get-Content $stderrPath -Tail 200
            }
          }

          if (Test-Path $stdoutPath) {
            Write-LogGroup "Daemon stdout tail" {
              Get-Content $stdoutPath -Tail 200
            }
          }

          $sessionSummary =
            if ($null -ne $sessions -and $null -ne $sessions.sessions) {
              (@($sessions.sessions | ForEach-Object { "$($_.id):$($_.status)" }) -join ", ")
            } else {
              "no session snapshot"
            }

          $resultsMarkdown =
            if ($results.Count -gt 0) {
              ($results | ForEach-Object { "- $($_.step): $($_.result) — $($_.message)" }) -join "`n"
            } else {
              "- no step results recorded"
            }

          $warmupTail =
            if ($warmupPolls.Count -gt 0) {
              ($warmupPolls | Select-Object -Last 3 | ConvertTo-Json -Depth 8)
            } else {
              "[]"
            }

          $discoveryTail =
            if ($discoveryPolls.Count -gt 0) {
              ($discoveryPolls | Select-Object -Last 3 | ConvertTo-Json -Depth 8)
            } else {
              "[]"
            }

          @"
          ## Smoke failure summary
          - Reason: $($context.reason)
          - Failed steps: $(if ($failedSteps.Count -gt 0) { $failedSteps -join ', ' } else { 'none recorded' })
          - Health: $(if ($null -ne $health) { $health.diagnosticSummary } else { 'health snapshot unavailable' })
          - Sessions: $sessionSummary

          ### Step results
          $resultsMarkdown

          ### Last warmup polls
          ```json
          $warmupTail
          ```

          ### Last discovery polls
          ```json
          $discoveryTail
          ```
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostics
          path: smoke-diagnostics\
          if-no-files-found: ignore
          retention-days: 3
