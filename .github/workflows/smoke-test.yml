name: Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/smoke-test.ps1'
      - 'samples/from-csharp/**'
      - 'SageFs/**'
      - 'SageFs.Core/**'

jobs:
  smoke:
    name: End-to-end smoke test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Checkout forked MCP SDK
        uses: actions/checkout@v5
        with:
          repository: WillEhrendreich/ModelContextProtocolSdk
          path: mcp-sdk

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Build forked MCP SDK packages
        run: |
          dotnet pack mcp-sdk/src/ModelContextProtocol.Core -o mcp-sdk-nupkg -c Release
          dotnet pack mcp-sdk/src/ModelContextProtocol -o mcp-sdk-nupkg -c Release
          dotnet pack mcp-sdk/src/ModelContextProtocol.AspNetCore -o mcp-sdk-nupkg -c Release

      - name: Build and pack SageFs tool
        run: |
          dotnet build --nologo -c Release
          dotnet pack SageFs -o nupkg --nologo -c Release

      - name: Install SageFs global tool
        run: dotnet tool install --global SageFs --add-source nupkg --no-cache

      - name: Run smoke test
        shell: pwsh
        run: scripts/smoke-test.ps1
        timeout-minutes: 10
