name: publish release

on:
  workflow_run:
    workflows: ["main build"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful main build run ID containing the release-assets artifact
        required: true
        type: string
  workflow_call:
    inputs:
      source_run_id:
        description: Successful main build run ID containing the release-assets artifact
        required: true
        type: string
    secrets:
      VSCE_PAT:
        required: true
      NUGET_API_KEY:
        required: true
      SAGEFS_NVIM_PAT:
        required: false
      OVSX_PAT:
        required: false

jobs:
  publish:
    if: |
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call'
    runs-on: windows-latest
    concurrency:
      group: ${{ github.event_name == 'workflow_call' && format('publish-{0}', inputs.source_run_id) || github.event_name == 'workflow_dispatch' && format('publish-{0}', github.event.inputs.source_run_id) || format('publish-{0}', github.event.workflow_run.id) }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    env:
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_call' && inputs.source_run_id || github.event_name == 'workflow_dispatch' && github.event.inputs.source_run_id || github.event.workflow_run.id }}
      VS_MARKETPLACE_PUBLISHER: willehrendreich

    steps:
    - name: Install Dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          11.0.x
          8.0.x
        dotnet-quality: preview

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install marketplace CLIs
      run: npm install -g @vscode/vsce tfx-cli ovsx

    - name: Download release bundle
      uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        run-id: ${{ env.SOURCE_RUN_ID }}
        name: release-assets
        path: release

    - name: Read release manifest
      id: manifest
      shell: pwsh
      run: |
        if (-not (Test-Path release/release-manifest.json)) { throw "release-manifest.json not found." }
        $manifest = Get-Content release/release-manifest.json -Raw | ConvertFrom-Json
        if (-not $manifest.version) { throw "Release manifest missing version." }
        if (-not $manifest.sourceSha) { throw "Release manifest missing source SHA." }
        "version=$($manifest.version)" >> $env:GITHUB_OUTPUT
        "source_sha=$($manifest.sourceSha)" >> $env:GITHUB_OUTPUT

    - name: Verify release bundle
      shell: pwsh
      run: |
        $manifest = Get-Content release/release-manifest.json -Raw | ConvertFrom-Json
        foreach ($file in $manifest.files) {
          $path = Join-Path release $file.name
          if (-not (Test-Path $path)) { throw "Missing artifact: $($file.name)" }
          $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $file.sha256) { throw "Checksum mismatch for $($file.name)" }
        }

    - name: Publish VS Code extension to Marketplace
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
      run: |
        npx @vscode/vsce publish --packagePath "release/sagefs-vscode-${{ steps.manifest.outputs.version }}.vsix" --skip-duplicate

    - name: Create Open VSX namespace (idempotent)
      continue-on-error: true
      env:
        OVSX_PAT: ${{ secrets.OVSX_PAT }}
      run: |
        Write-Host "Creating Open VSX namespace 'willehrendreich' (will warn if already exists)..."
        npx ovsx create-namespace willehrendreich --pat $env:OVSX_PAT
        Write-Host "Namespace step complete (exit $LASTEXITCODE — non-zero is expected if namespace already exists)"

    - name: Publish VS Code extension to Open VSX
      continue-on-error: true
      env:
        OVSX_PAT: ${{ secrets.OVSX_PAT }}
      run: |
        npx ovsx publish "release/sagefs-vscode-${{ steps.manifest.outputs.version }}.vsix" --pat $env:OVSX_PAT --skip-duplicate

    - name: Patch Visual Studio VSIX manifest
      id: vsix_patch
      shell: pwsh
      run: |
        $vsixPath = "release/sagefs-visualstudio-${{ steps.manifest.outputs.version }}.vsix"
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $archive = [System.IO.Compression.ZipFile]::Open($vsixPath, [System.IO.Compression.ZipArchiveMode]::Update)
        $entry = $archive.GetEntry("extension.vsixmanifest")
        if (-not $entry) { $archive.Dispose(); throw "extension.vsixmanifest not found in VSIX" }
        $stream = $entry.Open()
        $reader = [System.IO.StreamReader]::new($stream)
        $content = $reader.ReadToEnd()
        $reader.Close(); $stream.Close()
        $xml = [xml]$content
        $ns = "http://schemas.microsoft.com/developer/vsx-schema/2011"
        $nsMgr = [System.Xml.XmlNamespaceManager]::new($xml.NameTable)
        $nsMgr.AddNamespace("v", $ns)
        # Publisher is on the <Identity> child element, not the root <PackageManifest>
        $identity = $xml.SelectSingleNode("//v:Identity", $nsMgr)
        $manifestPublisher = $identity.GetAttribute("Publisher")
        $manifestId = $identity.GetAttribute("Id")
        Write-Host "Manifest publisher: '$manifestPublisher', id: '$manifestId'"
        "publisher=$manifestPublisher" >> $env:GITHUB_OUTPUT
        "extension_id=$manifestId" >> $env:GITHUB_OUTPUT
        $metadata = $xml.SelectSingleNode("//v:Metadata", $nsMgr)
        if ($metadata -and -not $xml.SelectSingleNode("//v:Categories", $nsMgr)) {
          $cat = $xml.CreateElement("Categories", $ns)
          $cat.InnerText = "Coding"
          $metadata.AppendChild($cat) | Out-Null
          Write-Host "Injected <Categories>Coding</Categories> into manifest"
        } else {
          Write-Host "Categories already present or Metadata not found — skipping"
        }
        $entry.Delete()
        $newEntry = $archive.CreateEntry("extension.vsixmanifest")
        $writeStream = $newEntry.Open()
        $xmlSettings = [System.Xml.XmlWriterSettings]::new()
        $xmlSettings.Encoding = [System.Text.UTF8Encoding]::new($false)
        $xmlSettings.Indent = $true
        $writer = [System.Xml.XmlWriter]::Create($writeStream, $xmlSettings)
        $xml.Save($writer)
        $writer.Close(); $writeStream.Close(); $archive.Dispose()
        Write-Host "VSIX patched successfully: $vsixPath"

    - name: Publish Visual Studio extension to Marketplace
      continue-on-error: true
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
      shell: pwsh
      run: |
        $vsixPath = "release/sagefs-visualstudio-${{ steps.manifest.outputs.version }}.vsix"
        $publisher = "${{ steps.vsix_patch.outputs.publisher }}"
        $extId = "${{ steps.vsix_patch.outputs.extension_id }}"
        Write-Host "Publisher: '$publisher', ExtensionId: '$extId', VSIX: '$vsixPath'"
        # VsixPublisher.exe is the correct tool for VS Marketplace — the Gallery REST API
        # returns VsIdeExtensionNotSupported for VS IDE extensions.
        $vsixPublisher = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\VSSDK\VisualStudioIntegration\Tools\Bin\VsixPublisher.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $vsixPublisher) {
          Write-Host "::warning::VsixPublisher.exe not found on this runner — skipping VS Marketplace publish"
          exit 1
        }
        Write-Host "Using VsixPublisher.exe at: $($vsixPublisher.FullName)"
        # VsixPublisher publish manifest schema (from http://json.schemastore.org/vsix-publish):
        # - publisher: required at ROOT level (not inside identity)
        # - identity.internalName: required (the only required field inside identity)
        # - priceCategory: lowercase "free"
        $overviewPath = [System.IO.Path]::Combine($env:RUNNER_TEMP, "sagefs-overview.md")
        $overviewLines = @(
          "# SageFs for Visual Studio",
          "",
          "F# live development environment with an integrated REPL, live testing, session management, and real-time code intelligence - directly inside Visual Studio 2022.",
          "",
          "## Features",
          "- Interactive F# REPL sessions without leaving VS",
          "- Live test feedback as you type",
          "- Session history and replay",
          "- Code coverage gutter indicators",
          "- Works alongside your existing F# projects"
        )
        Set-Content -Path $overviewPath -Value ($overviewLines -join "`n") -Encoding UTF8
        $publishManifest = [ordered]@{
          '$schema'     = 'http://json.schemastore.org/vsix-publish'
          categories    = @("coding")   # lowercase enum value per schemastore.org/vsix-publish
          identity      = @{ internalName = $extId }
          overview      = $overviewPath
          publisher     = $publisher
          priceCategory = "free"
          private       = $false
          qna           = $true
          repo          = "https://github.com/WillEhrendreich/SageFs"
        } | ConvertTo-Json -Depth 5
        $manifestPath = [System.IO.Path]::Combine($env:RUNNER_TEMP, "publish-manifest.json")
        Set-Content -Path $manifestPath -Value $publishManifest -Encoding UTF8
        Write-Host "Publish manifest: $publishManifest"
        & $vsixPublisher.FullName publish -payload $vsixPath -publishManifest $manifestPath -personalAccessToken $env:VSCE_PAT 2>&1
        $exitCode = $LASTEXITCODE
        Remove-Item $manifestPath -ErrorAction SilentlyContinue
        if ($exitCode -ne 0) {
          Write-Host "::warning::VsixPublisher.exe failed (exit $exitCode) — NuGet and GitHub Release will still proceed."
          exit 1
        }
        Write-Host "SUCCESS"

    - name: Push to NuGet
      run: dotnet nuget push "release/SageFs.${{ steps.manifest.outputs.version }}.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Generate release notes
      id: release_notes
      shell: pwsh
      run: |
        # Build real release notes from the conventional commits between the
        # previous release tag and this release's source SHA. The notes
        # explain the PROBLEMS SOLVED, not just a commit list.
        git fetch --tags --depth 200 origin
        $prevTag = git describe --tags --abbrev=0 "${{ steps.manifest.outputs.source_sha }}"^ 2>$null
        if (-not $prevTag) { $prevTag = $(git tag --sort=-creatordate | Select-Object -First 1) }
        $range = if ($prevTag) { "$prevTag..${{ steps.manifest.outputs.source_sha }}" } else { "${{ steps.manifest.outputs.source_sha }}" }
        $commits = git log --pretty=format:"%s" $range 2>$null
        if (-not $commits) { $commits = git log --pretty=format:"%s" -20 }

        $feats = @(); $fixes = @(); $chores = @(); $tests = @()
        foreach ($c in $commits) {
          if ($c -match '^feat(\([^)]*\))?:') { $feats += $c }
          elseif ($c -match '^fix(\([^)]*\))?:') { $fixes += $c }
          elseif ($c -match '^test(\([^)]*\))?:') { $tests += $c }
          elseif ($c -match '^(chore|docs|refactor|perf|build|ci)(\([^)]*\))?:') { $chores += $c }
        }

        $sb = [System.Text.StringBuilder]::new()
        [void]$sb.AppendLine("## SageFs v${{ steps.manifest.outputs.version }}")
        [void]$sb.AppendLine("")
        $headline =
          if ($fixes.Count -gt 0 -and $feats.Count -gt 0) {
            "This release fixes $($fixes.Count) issue(s) and adds $($feats.Count) capability/capabilities. Highlights below."
          } elseif ($fixes.Count -gt 0) {
            "This release fixes $($fixes.Count) issue(s). Highlights below."
          } else {
            "This release adds $($feats.Count) capability/capabilities. Highlights below."
          }
        [void]$sb.AppendLine($headline)
        [void]$sb.AppendLine("")
        [void]$sb.AppendLine("### Problems solved")
        [void]$sb.AppendLine("")
        if ($fixes.Count -gt 0) {
          [void]$sb.AppendLine("**Fixes**")
          foreach ($f in $fixes) { [void]$sb.AppendLine("- $f") }
          [void]$sb.AppendLine("")
        }
        if ($feats.Count -gt 0) {
          [void]$sb.AppendLine("**New capabilities**")
          foreach ($f in $feats) { [void]$sb.AppendLine("- $f") }
          [void]$sb.AppendLine("")
        }
        if ($tests.Count -gt 0) {
          [void]$sb.AppendLine("**Testing / proof**")
          foreach ($t in $tests) { [void]$sb.AppendLine("- $t") }
          [void]$sb.AppendLine("")
        }
        if ($chores.Count -gt 0) {
          [void]$sb.AppendLine("**Maintenance**")
          foreach ($c in $chores) { [void]$sb.AppendLine("- $c") }
          [void]$sb.AppendLine("")
        }
        [void]$sb.AppendLine("### Downloads")
        [void]$sb.AppendLine("- **NuGet**: `dotnet tool install --global SageFs`")
        [void]$sb.AppendLine("- **VS Code Extension**: `code --install-extension sagefs-vscode-${{ steps.manifest.outputs.version }}.vsix`")
        [void]$sb.AppendLine("- **Visual Studio Extension**: double-click the VSIX to install in Visual Studio 2022+")
        [void]$sb.AppendLine("- **Neovim**: see [sagefs.nvim](https://github.com/WillEhrendreich/sagefs.nvim)")

        $notesPath = Join-Path $env:RUNNER_TEMP "RELEASE_NOTES.md"
        Set-Content -Path $notesPath -Value $sb.ToString() -Encoding UTF8
        Write-Host "Release notes generated ($($commits.Count) commits since $prevTag)"
        "notes_path=$notesPath" >> $env:GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.manifest.outputs.version }}
        name: v${{ steps.manifest.outputs.version }}
        target_commitish: ${{ steps.manifest.outputs.source_sha }}
        files: |
          release/*.nupkg
          release/*.vsix
        body_path: ${{ steps.release_notes.outputs.notes_path }}
        make_latest: true

    - name: Sync sagefs.nvim version tag
      env:
        NVIM_PAT: ${{ secrets.SAGEFS_NVIM_PAT }}
      if: env.NVIM_PAT != ''
      continue-on-error: true
      shell: pwsh
      run: |
        $tmpDir = New-Item -ItemType Directory -Path (Join-Path $env:TEMP "sagefs-nvim-$(Get-Random)")
        Push-Location $tmpDir
        git clone --depth 1 "https://x-access-token:$($env:NVIM_PAT)@github.com/WillEhrendreich/sagefs.nvim.git" .
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        Set-Content -Path "lua/sagefs/version.lua" -Value "return '${{ steps.manifest.outputs.version }}'"
        git add lua/sagefs/version.lua
        $changed = git diff --cached --quiet; if ($LASTEXITCODE -ne 0) { git commit -m "chore: sync version to v${{ steps.manifest.outputs.version }}" }
        git push origin main
        git tag -f "v${{ steps.manifest.outputs.version }}" -m "Release v${{ steps.manifest.outputs.version }} (synced from SageFs)"
        git push origin "v${{ steps.manifest.outputs.version }}" --force
        Pop-Location
