name: publish release

on:
  workflow_run:
    workflows: ["main build"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful main build run ID containing the release-assets artifact
        required: true
        type: string
      bypass_dod:
        description: "Emergency release bypass: skip the Definition-of-Done gate. ONLY use when users need a working release now and the remaining DoD journeys are tracked in issues #127-#129."
        required: false
        default: false
        type: boolean

# SECURITY: this job runs on THIS machine, with the publishing tokens. The repo
# is public, so nothing a fork can trigger may reach it: there is no
# pull_request trigger and no workflow_call (a PR workflow could call one), and
# workflow_run only fires for a successful main build on master, from this
# repo, using THIS file rather than the PR's copy. "Self-hosted runner safety"
# in TrustSignalTests fails the fast suite if that stops being true.
jobs:
  publish:
    if: |
      github.event_name != 'pull_request' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'master') ||
       github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, sagefs-local]
    timeout-minutes: 60
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && format('publish-{0}', github.event.inputs.source_run_id) || format('publish-{0}', github.event.workflow_run.id) }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    env:
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_run_id || github.event.workflow_run.id }}

    steps:
    # Checkout FIRST so the workspace is a git repo with full history (the
    # release-notes step needs tags) AND so `release/` (downloaded below)
    # stays under the workspace root — later steps reference relative paths.
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # A job step's PATH is the runner service's (/usr/local/bin:/usr/bin), and
    # /usr/bin/dotnet on this machine is the distro's dotnet-host: a runtime,
    # no SDKs, so `dotnet fsi` dies with "No .NET SDKs were found". The SDKs
    # live in DOTNET_ROOT. Put that first and say so, loudly, if it isn't there.
    - name: Use this machine's .NET SDK
      shell: bash
      run: |
        root="${DOTNET_ROOT:-$HOME/.dotnet}"
        if [ ! -x "$root/dotnet" ]; then
          echo "::error::No dotnet at $root. Set DOTNET_ROOT in the runner's .env, or install the SDK there."
          exit 1
        fi
        echo "$root" >> "$GITHUB_PATH"
        echo "DOTNET_ROOT=$root" >> "$GITHUB_ENV"
        "$root/dotnet" --list-sdks

    - name: Enforce release Definition of Done
      if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.bypass_dod == 'true') }}
      shell: bash
      run: dotnet fsi scripts/release-dod.fsx

    - name: Warn when release bypassed the Definition of Done gate
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bypass_dod == 'true' }}
      shell: bash
      run: echo "::warning::Release Definition of Done gate BYPASSED via workflow_dispatch. Remaining obligations tracked in issues #127 (hot-reload), #128 (live-testing), #129 (friction)."

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install marketplace CLIs
      # VS Code only: vsce (VS Code Marketplace) + ovsx (Open VSX). The Visual
      # Studio extension is deprecated and no longer published, so its
      # publisher CLI (tfx-cli) and publisher id are gone.
      shell: bash
      run: npm install -g @vscode/vsce ovsx

    - name: Download release bundle
      uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        run-id: ${{ env.SOURCE_RUN_ID }}
        name: release-assets
        path: release

    # Reads the manifest AND checks every file against its recorded SHA-256, so
    # nothing ships that the gate didn't build.
    - name: Read and verify the release bundle
      id: manifest
      shell: bash
      run: dotnet fsi scripts/release-bundle.fsx release

    - name: Publish VS Code extension to Marketplace
      shell: bash
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
      run: npx @vscode/vsce publish --packagePath "release/sagefs-vscode-${{ steps.manifest.outputs.version }}.vsix" --skip-duplicate

    - name: Create Open VSX namespace (idempotent)
      continue-on-error: true
      shell: bash
      env:
        OVSX_PAT: ${{ secrets.OVSX_PAT }}
      run: |
        echo "Creating Open VSX namespace 'willehrendreich' (a non-zero exit here just means it already exists)."
        npx ovsx create-namespace willehrendreich --pat "$OVSX_PAT" || true

    - name: Publish VS Code extension to Open VSX
      continue-on-error: true
      shell: bash
      env:
        OVSX_PAT: ${{ secrets.OVSX_PAT }}
      run: npx ovsx publish "release/sagefs-vscode-${{ steps.manifest.outputs.version }}.vsix" --pat "$OVSX_PAT" --skip-duplicate

    - name: Push to NuGet
      shell: bash
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: dotnet nuget push "release/SageFs.${{ steps.manifest.outputs.version }}.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Generate release notes
      id: release_notes
      shell: bash
      run: dotnet fsi scripts/release-notes.fsx "${{ steps.manifest.outputs.version }}" "${{ steps.manifest.outputs.source_sha }}" "$RUNNER_TEMP/RELEASE_NOTES.md"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.manifest.outputs.version }}
        name: v${{ steps.manifest.outputs.version }}
        target_commitish: ${{ steps.manifest.outputs.source_sha }}
        files: |
          ${{ github.workspace }}/release/*.nupkg
          ${{ github.workspace }}/release/*.vsix
        body_path: ${{ steps.release_notes.outputs.notes_path }}
        make_latest: true

    - name: Sync sagefs.nvim version tag
      env:
        NVIM_PAT: ${{ secrets.SAGEFS_NVIM_PAT }}
        VERSION: ${{ steps.manifest.outputs.version }}
      if: env.NVIM_PAT != ''
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        tmp=$(mktemp -d)
        git clone --depth 1 "https://x-access-token:${NVIM_PAT}@github.com/WillEhrendreich/sagefs.nvim.git" "$tmp"
        cd "$tmp"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        printf "return '%s'\n" "$VERSION" > lua/sagefs/version.lua
        git add lua/sagefs/version.lua
        git diff --cached --quiet || git commit -m "chore: sync version to v${VERSION}"
        git push origin main
        git tag -f "v${VERSION}" -m "Release v${VERSION} (synced from SageFs)"
        git push origin "v${VERSION}" --force
        cd /
        rm -rf "$tmp"
